name: Cross-device integration checks
on:
  push:
    branches:
      - feature/unified-journey-progress-2026
  pull_request:
    branches:
      - design/pillar-icons-identity-2026
      - develop
jobs:
  mobile-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:progress
      - run: npm run test:watch
